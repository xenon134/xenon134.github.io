<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for a polished look and feel */
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Custom scrollbar for a better dark mode experience */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background-color: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #94a3b8;
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-track {
            background-color: #1e293b;
        }
        .dark ::-webkit-scrollbar-thumb {
            background-color: #475569;
        }

        /* Modal transition */
        #modal {
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }

        /* Ensure fixed header has a backdrop blur for readability */
        .header-backdrop {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* Custom toast notification styling */
        #toast {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
            transform: translateY(-150%);
        }
        #toast.show {
            transform: translateY(0);
        }

        /* Simple spinner for loading states */
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .dark .spinner {
            border-left-color: #38bdf8;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200 antialiased">

    <!-- Toast Notification for errors -->
    <div id="toast" class="fixed top-5 right-5 bg-red-500 text-white py-2 px-4 rounded-lg shadow-lg z-50 opacity-0">
        <p id="toast-message"></p>
    </div>

    <!-- Main Application Container -->
    <div id="app" class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">

        <!-- Header: Fixed Balance Bar -->
        <header id="balance-bar" class="fixed top-0 left-0 right-0 z-10 bg-slate-100/80 dark:bg-slate-900/80 header-backdrop">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
                <h1 class="text-xl font-bold text-slate-900 dark:text-white mb-2">My Finances</h1>
                <div id="balances" class="flex flex-wrap gap-x-4 gap-y-2 text-sm sm:text-base">
                    <!-- Balances will be dynamically inserted here -->
                </div>
            </div>
        </header>

        <!-- Transaction List -->
        <main id="transaction-list" class="pt-28 pb-24">
            <!-- Transactions will be dynamically inserted here -->
        </main>

        <!-- Floating Action Button -->
        <button id="add-btn" hidden class="fixed bottom-6 right-6 bg-blue-600 hover:bg-blue-700 text-white rounded-full w-14 h-14 flex items-center justify-center shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-400 dark:focus:ring-blue-800 transition-transform duration-200 transform hover:scale-105 hidden">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
        </button>

        <!-- Modal for Add/Edit Transaction -->
        <div id="modal" class="fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-4 invisible opacity-0">
            <div id="modal-content" class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-2xl transform transition-transform duration-300 scale-95">
                <div class="p-6">
                    <h2 id="modal-title" class="text-2xl font-bold mb-4 text-slate-900 dark:text-white">Edit Transaction</h2>
                    <form id="tx-form" class="w-full">
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                            <div class="sm:col-span-2">
                                <label for="tx-name" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Name</label>
                                <input id="tx-name" type="text" class="mt-1 block w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="e.g. Grocery, Salary" />
                            </div>
                            <div>
                                <label for="tx-time" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Time</label>
                                <input id="tx-time" type="datetime-local" class="mt-1 block w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="tx-desc" class="block text-sm font-medium text-slate-700 dark:text-slate-200">Description</label>
                            <input id="tx-desc" type="text" class="mt-1 block w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Optional details..." />
                        </div>

                        <div class="mb-3">
                            <div class="flex items-center justify-between">
                                <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">Amounts</label>
                                <button id="add-amt" type="button" class="text-sm text-blue-600 hover:underline">Add row</button>
                            </div>
                            <div id="amt-list" class="mt-2 space-y-2">
                                <!-- amount rows injected here -->
                            </div>
                        </div>
                    </form>
                </div>
                <div class="bg-slate-50 dark:bg-slate-700/50 px-6 py-4 flex flex-col sm:flex-row-reverse gap-3 rounded-b-xl">
                    <button id="save-btn" class="w-full sm:w-auto sm:ml-3 inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:ring-offset-slate-800 disabled:opacity-50">Save</button>
                    <button id="delete-btn" class="w-full sm:w-auto inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 dark:ring-offset-slate-800 disabled:opacity-50">Delete</button>
                    <button id="cancel-btn" class="w-full sm:w-auto mt-3 sm:mt-0 inline-flex justify-center rounded-md border border-slate-300 dark:border-slate-500 shadow-sm px-4 py-2 bg-white dark:bg-slate-600 text-base font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-400 dark:ring-offset-slate-800">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- JSONBin.io Configuration ---
        const binId = '68eb75dc43b1c97be963caa5';
        let apiKey = localStorage.getItem('jsonBinApiKey');
        if (!apiKey) {
            apiKey = prompt('Enter key: ');
            if (apiKey) {
                localStorage.setItem('jsonBinApiKey', apiKey);
            }
        }

        // Simple assertions and validators
        const assert = (cond, msg) => { if (!cond) { alert(msg); throw new Error(msg); } };
        const isValidAmount = (a) =>
            a && typeof a.wallet === 'string' && a.wallet.trim().length > 0
            && typeof a.amt === 'number' && Number.isFinite(a.amt);
        const isValidTransaction = (t) =>
            t && typeof t.name === 'string'
            && Array.isArray(t.amts) && t.amts.every(isValidAmount)
            && typeof t.time === 'string' && !Number.isNaN(new Date(t.time).getTime());
        const validateTransactionsArray = (arr, where = 'data') => {
            assert(Array.isArray(arr), `Invalid transactions in ${where}: expected an array.`);
            arr.forEach((t, i) => assert(isValidTransaction(t), `Invalid transaction at index ${i} in ${where}.`));
        };

        // --- JSONBin.io API Functions ---
        async function getData() {
          assert(apiKey, 'API key is required to load data.');
          const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`, {
            method: 'GET',
            headers: { 'X-Master-Key': apiKey },
          });
          if (!response.ok) {
            const txt = await response.text().catch(() => '');
            alert(`Load failed: ${response.status} ${response.statusText}`);
            throw new Error(`GET failed: ${response.status} ${txt}`);
          }
          const data = await response.json();
          const record = data.record;
          // Strictly validate shape; no silent fallback to []
          if (Array.isArray(record)) {
            validateTransactionsArray(record, 'record');
            return { transactions: record };
          }
          assert(record && typeof record === 'object', 'Invalid backend record shape (not an object or array).');
          assert(Array.isArray(record.transactions), 'Backend missing "transactions" array.');
          validateTransactionsArray(record.transactions, 'record.transactions');
          return { transactions: record.transactions };
        }

        async function setData(jsonData) {
          // Expect full object shape now: { transactions: [...] }; validate before PUT
          assert(jsonData && Array.isArray(jsonData.transactions), 'Tried saving without a valid transactions array.');
          validateTransactionsArray(jsonData.transactions, 'save payload');
          const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': apiKey,
            },
            body: JSON.stringify(jsonData),
          });
          if (!response.ok) {
            const txt = await response.text().catch(() => '');
            alert(`Save failed: ${response.status} ${response.statusText}`);
            throw new Error(`PUT failed: ${response.status} ${txt}`);
          }
        }

        // --- STATE ---
        let transactions = [];
        let currentlyEditingIndex = null;
        let dataLoaded = false;
        
        // --- DOM ELEMENTS ---
        const balanceContainer = document.getElementById('balances');
        const transactionList = document.getElementById('transaction-list');
        const addBtn = document.getElementById('add-btn');
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const txForm = document.getElementById('tx-form');
        const txName = document.getElementById('tx-name');
        const txDesc = document.getElementById('tx-desc');
        const txTime = document.getElementById('tx-time');
        const amtList = document.getElementById('amt-list');
        const addAmtBtn = document.getElementById('add-amt');
        const saveBtn = document.getElementById('save-btn');
        const deleteBtn = document.getElementById('delete-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // --- UTILITY FUNCTIONS ---
        const formatDate = (dateString) => {
            const date = new Date(dateString);
            const datePart = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const timePart = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            return { datePart, timePart };
        };

        // --- Amount row helpers ---
        const createAmtRow = (wallet = '', amt = 0) => {
            const row = document.createElement('div');
            row.className = 'flex gap-2 items-center';

            const walletInput = document.createElement('input');
            walletInput.type = 'text';
            walletInput.placeholder = 'Wallet';
            walletInput.value = wallet;
            walletInput.className = 'flex-1 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2 text-sm';

            const amtInput = document.createElement('input');
            amtInput.type = 'text';
            amtInput.step = '0.01';
            amtInput.placeholder = '-0.00';
            amtInput.value = amt === 0 ? '-' : amt;
            amtInput.className = 'w-36 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2 text-sm font-mono';

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'text-red-600 hover:underline text-sm';
            removeBtn.textContent = 'Remove';
            removeBtn.addEventListener('click', () => row.remove());

            row.appendChild(walletInput);
            row.appendChild(amtInput);
            row.appendChild(removeBtn);

            return row;
        };

        const populateAmtList = (amts) => {
            amtList.innerHTML = '';
            amts.forEach(a => amtList.appendChild(createAmtRow(a.wallet, a.amt)));
        };

        addAmtBtn.addEventListener('click', () => {
            amtList.appendChild(createAmtRow('', 0));
        });

        const getCurrentDateTime = () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        };

        const showToast = (message) => {
            toastMessage.textContent = message;
            toast.classList.add('show', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('show', 'opacity-100');
            }, 3000);
        };

        const setModalButtonsLoading = (isLoading) => {
            saveBtn.disabled = isLoading;
            deleteBtn.disabled = isLoading;
            cancelBtn.disabled = isLoading;
            saveBtn.textContent = isLoading ? 'Saving...' : 'Save';
            deleteBtn.textContent = isLoading ? 'Deleting...' : 'Delete';
        };

        // --- RENDER FUNCTIONS ---
        const renderBalances = () => {
            if (!transactions || transactions.length === 0) {
                balanceContainer.innerHTML = `<p class="text-sm text-slate-500 dark:text-slate-400">No data available.</p>`;
                return;
            }
            const walletBalances = transactions.reduce((acc, tx) => {
                tx.amts.forEach(item => {
                    acc[item.wallet] = (acc[item.wallet] || 0) + item.amt;
                });
                return acc;
            }, {});

            let totalBalance = 0;
            balanceContainer.innerHTML = ''; 

            const sortedWallets = Object.keys(walletBalances).sort();

            sortedWallets.forEach(wallet => {
                const balance = walletBalances[wallet];
                totalBalance += balance;
                const balanceEl = document.createElement('div');
                balanceEl.className = 'flex items-center gap-2';
                balanceEl.innerHTML = `
                    <span class="font-semibold text-slate-700 dark:text-slate-300">${wallet}:</span>
                    <span class="font-mono font-medium ${balance >= 0 ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">₹${balance.toLocaleString('en-IN')}</span>
                `;
                balanceContainer.appendChild(balanceEl);
            });
            
            const totalEl = document.createElement('div');
            totalEl.className = 'flex items-center gap-2 font-bold border-slate-300 dark:border-slate-600';
            totalEl.innerHTML = `
                <span class="text-slate-800 dark:text-slate-100">Total:</span>
                <span class="font-mono ${totalBalance >= 0 ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">₹${totalBalance.toLocaleString('en-IN')}</span>
            `;
            balanceContainer.appendChild(totalEl);
        };

        const renderTransactions = () => {
            transactionList.innerHTML = '';
            
            if (!transactions) return; // Should be handled by loading/error state

            // Calculate final balances for all wallets
            const finalWalletBalances = transactions.reduce((acc, tx) => {
                tx.amts.forEach(item => {
                    acc[item.wallet] = (acc[item.wallet] || 0) + item.amt;
                });
                return acc;
            }, {});

            const runningWalletBalances = { ...finalWalletBalances };

            const sortedTransactions = [...transactions].sort((a, b) => new Date(b.time) - new Date(a.time));

            if (sortedTransactions.length === 0) {
                transactionList.innerHTML = `<p class="text-center text-slate-500 dark:text-slate-400 py-10">No transactions yet. Click the '+' button to add one!</p>`;
                return;
            }
            
            sortedTransactions.forEach((tx) => {
                const { datePart, timePart } = formatDate(tx.time);
                const totalAmt = tx.amts.reduce((sum, item) => sum + item.amt, 0);
                const isCredit = totalAmt >= 0;

                // Aggregate wallet changes and filter out zero-change wallets
                const walletDeltas = tx.amts.reduce((acc, { wallet, amt }) => {
                    if (amt === 0) return acc; // zero => no change
                    acc[wallet] = (acc[wallet] || 0) + amt;
                    return acc;
                }, {});
                const changedWallets = Object.keys(walletDeltas).filter(w => walletDeltas[w] !== 0);

                // Generate wallet details only for wallets that actually changed in this tx
                const walletDetailsHtml = changedWallets.map(wallet => {
                    const balanceAfterTx = (runningWalletBalances[wallet] ?? 0);
                    return `
                        <div class="flex justify-between items-baseline text-xs">
                            <span class="text-slate-500 dark:text-slate-400">${wallet}</span>
                            <span class="font-mono text-slate-600 dark:text-slate-300">₹${balanceAfterTx.toLocaleString('en-IN')}</span>
                        </div>
                    `;
                }).join('');

                const row = document.createElement('div');
                row.className = 'bg-white dark:bg-slate-800 rounded-xl shadow-md p-4 mb-4 flex flex-col cursor-pointer hover:shadow-lg hover:scale-[1.02] transition-all duration-200';
                const txIndex = transactions.findIndex(t => t === tx);
                row.dataset.index = txIndex;

                row.innerHTML = `
                    <div class="flex items-center justify-between w-full">
                        <div class="flex items-center gap-4">
                            <div class="text-center w-12 flex-shrink-0" title="${timePart}">
                                <div class="font-bold text-slate-800 dark:text-slate-200">${datePart.split(' ')[0]}</div>
                                <div class="text-sm text-slate-600 dark:text-slate-400">${datePart.split(' ')[1]}</div>
                            </div>
                            <div>
                                <p class="font-semibold text-slate-900 dark:text-white">${tx.name}</p>
                                ${tx.desc ? `<p class="text-sm text-slate-500 dark:text-slate-400">${tx.desc}</p>` : ''}
                            </div>
                        </div>
                        <div class="font-mono font-bold text-lg text-right ${isCredit ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">
                            ${Math.abs(totalAmt).toLocaleString('en-IN')}
                        </div>
                    </div>
                    ${walletDetailsHtml ? `<div class="mt-3 pt-2 pl-16 border-t border-slate-200 dark:border-slate-700 space-y-1">${walletDetailsHtml}</div>` : ''}
                `;
                
                row.addEventListener('click', () => openModal(txIndex));
                transactionList.appendChild(row);

                // Update running balances for the next (older) transaction
                tx.amts.forEach(item => {
                    runningWalletBalances[item.wallet] -= item.amt;
                });
            });
        };

        const rerenderApp = () => {
            renderBalances();
            renderTransactions();
            document.getElementById("add-btn").classList.remove("hidden");
        };

        // --- MODAL LOGIC ---
        const openModal = (index = null) => {
            // Guard index validity on edit
            if (index !== null) {
                assert(Number.isInteger(index) && index >= 0 && index < transactions.length, 'Invalid transaction index for editing.');
            }
            currentlyEditingIndex = index;
            if (index !== null) {
                modalTitle.textContent = 'Edit Transaction';
                const tx = transactions[index];
                txName.value = tx.name || '';
                txDesc.value = tx.desc || '';
                txTime.value = tx.time ? tx.time.slice(0,16) : getCurrentDateTime();
                populateAmtList(tx.amts || [{ wallet: '', amt: 0 }]);
                deleteBtn.style.display = 'inline-flex';
            } else {
                modalTitle.textContent = 'Add New Transaction';
                txName.value = '';
                txDesc.value = '';
                txTime.value = getCurrentDateTime();
                populateAmtList([{ wallet: 'UPI', amt: 0 }, { wallet: 'Cash', amt: 0 }]);
                deleteBtn.style.display = 'none';
            }
            modal.classList.remove('invisible', 'opacity-0');
            modalContent.classList.remove('scale-95');
        };

        const closeModal = () => {
            modal.classList.add('invisible', 'opacity-0');
            modalContent.classList.add('scale-95');
            currentlyEditingIndex = null;
        };

        const handleSave = async () => {
            // Do not allow saving until data is loaded
            assert(dataLoaded, 'Data not loaded yet. Please wait and try again.');
            // Build transaction object from form
            const amts = [];
            const rows = Array.from(amtList.children);
            for (const r of rows) {
                const inputs = r.getElementsByTagName('input');
                const wallet = inputs[0].value.trim();
                const amtRaw = inputs[1].value;
                const amt = (amtRaw === '-' || amtRaw === '') ? 0 : Number(amtRaw);
                if (!wallet) {
                    showToast('Each amount row must have a wallet name.');
                    return;
                }
                if (Number.isNaN(amt) || amtRaw.trim() === '') {
                    showToast('Amounts must be valid numbers and cannot be empty.');
                    return;
                }
                amts.push({ wallet, amt });
            }

            // Additional time validation
            assert(txName.value.trim().length > 0, 'Transaction name is required.');
            assert(txTime.value, 'Transaction time is required.');
            assert(!Number.isNaN(new Date(txTime.value).getTime()), 'Invalid transaction time.');

            const updatedTx = {
                name: txName.value.trim(),
                desc: txDesc.value.trim(),
                amts,
                time: txTime.value
            };

            // Validate the single transaction prior to merging
            assert(isValidTransaction(updatedTx), 'Built transaction is invalid. Please check inputs.');

            const tempTransactions = JSON.parse(JSON.stringify(transactions));
            if (currentlyEditingIndex !== null) {
                assert(currentlyEditingIndex >= 0 && currentlyEditingIndex < tempTransactions.length, 'Invalid transaction index during save.');
                tempTransactions[currentlyEditingIndex] = updatedTx;
            } else {
                tempTransactions.unshift(updatedTx);
            }

            // Validate entire payload before saving
            validateTransactionsArray(tempTransactions, 'pre-save');

            setModalButtonsLoading(true);
            try {
                await setData({ transactions: tempTransactions });
                transactions = tempTransactions; // Commit change
                rerenderApp();
                closeModal();
            } catch (err) {
                console.error("Failed to save data:", err);
                showToast("Error: Could not save changes to the server.");
            } finally {
                setModalButtonsLoading(false);
            }
        };

        const handleDelete = async () => {
            assert(dataLoaded, 'Data not loaded yet. Please wait and try again.');
            if (currentlyEditingIndex !== null) {
                assert(currentlyEditingIndex >= 0 && currentlyEditingIndex < transactions.length, 'Invalid transaction index during delete.');
                const tempTransactions = transactions.filter((_, index) => index !== currentlyEditingIndex);
                validateTransactionsArray(tempTransactions, 'pre-delete');

                setModalButtonsLoading(true);
                try {
                    await setData({ transactions: tempTransactions });
                    transactions = tempTransactions; // Commit change
                    rerenderApp();
                    closeModal();
                } catch (err) {
                    console.error("Failed to delete data:", err);
                    showToast("Error: Could not delete entry on the server.");
                } finally {
                    setModalButtonsLoading(false);
                }
            }
        };

        // --- EVENT LISTENERS ---
        addBtn.addEventListener('click', () => {
            assert(dataLoaded, 'Data not loaded yet. Please wait and try again.');
            openModal();
        });
        saveBtn.addEventListener('click', handleSave);
        deleteBtn.addEventListener('click', handleDelete);
        cancelBtn.addEventListener('click', closeModal);
       modal.addEventListener('click', (e) => {
           if (e.target === modal) closeModal();
       });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modal.classList.contains('invisible')) {
                closeModal();
            }
        });

        // --- INITIALIZATION ---
        const initializeApp = async () => {
            if (!apiKey) {
                alert('API key is required to load data. Reload and provide a key.');
                return;
            }
            transactionList.innerHTML = `
                <div class="flex flex-col items-center justify-center pt-16">
                    <div class="spinner"></div>
                    <p class="mt-4 text-slate-500 dark:text-slate-400">Loading financial data...</p>
                </div>`;

            try {
                const data = await getData();
                assert(data && Array.isArray(data.transactions), 'Loaded data missing transactions array.');
                transactions = data.transactions;
                dataLoaded = true;
                rerenderApp();
            } catch (error) {
                console.error("Failed to load initial data:", error);
                alert('Failed to load data. See console for details.');
                balanceContainer.innerHTML = '';
                transactionList.innerHTML = `
                    <div class="text-center py-10 px-4">
                         <svg class="mx-auto h-12 w-12 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        <h3 class="mt-2 text-lg font-medium text-slate-800 dark:text-slate-200">Failed to Load Data</h3>
                        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Could not retrieve your financial records. Please check your internet connection and ensure the API key in the script is configured correctly.</p>
                    </div>`;
            }
        };

        initializeApp();

    });
    </script>
</body>
</html>
